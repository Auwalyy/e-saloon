# Render Blueprint: deploys the API and the website from this repository.
# In Render choose New > Blueprint and select this repo, then fill in the
# values marked "sync: false" when prompted.
services:
  # ----------------------------------------------------------------- API ---
  - type: web
    name: e-salon-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false            # your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true    # Render creates a long random secret
      - key: FRONTEND_URL
        sync: false            # the website URL, e.g. https://e-salon.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Aisha Bello
      - key: SALON_TIMEZONE
        value: Africa/Lagos

  # ------------------------------------------------------------- Website ---
  - type: web
    name: e-salon
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Single-page app: every path is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false            # the API URL plus /api, e.g. https://e-salon-api.onrender.com/api
